name: TrisMarketLens
options:
  bundleIdPrefix: com.iosdevbyul
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  WakTrainerDesignSystem:
    url: https://github.com/iosdevbyul/WakTrainerDesignSystem
    revision: 0477e6cf7a04b6e251b5e3b05a573dd1ad61f612
  TrisNetworkKit:
    url: https://github.com/iosdevbyul/TrisNetworkKit
    revision: a3d367495874e500c89b1825796b12f1fc8ffe07
targets:
  TrisMarketLens:
    type: application
    platform: iOS
    sources:
      - path: TrisMarketLens
    dependencies:
      - package: WakTrainerDesignSystem
      - package: TrisNetworkKit
        product: NetworkKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iosdevbyul.TrisMarketLens
        INFOPLIST_KEY_CFBundleDisplayName: TrisMarketLens
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
  TrisMarketLensTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: TrisMarketLens
      - package: TrisNetworkKit
        product: NetworkKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TrisMarketLens:
    build:
      targets:
        TrisMarketLens: all
    test:
      targets:
        - TrisMarketLensTests
