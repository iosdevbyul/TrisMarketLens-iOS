name: TrisMarketLens
options:
  bundleIdPrefix: com.iosdevbyul
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  TrisMarketLens:
    type: application
    platform: iOS
    sources:
      - path: TrisMarketLens
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iosdevbyul.TrisMarketLens
        INFOPLIST_KEY_CFBundleDisplayName: TrisMarketLens
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
  TrisMarketLensTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: TrisMarketLens
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TrisMarketLens:
    build:
      targets:
        TrisMarketLens: all
    test:
      targets:
        - TrisMarketLensTests
