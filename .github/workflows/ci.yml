name: iOS CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project TrisMarketLens.xcodeproj \
            -scheme TrisMarketLens \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      - name: Prepare iOS simulator
        id: simulator
        run: |
          if ! xcrun simctl list runtimes -j | python3 -c 'import json,sys; sys.exit(0 if any(r.get("isAvailable") and r.get("platform") == "iOS" for r in json.load(sys.stdin)["runtimes"]) else 1)'; then
            xcodebuild -downloadPlatform iOS
          fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import subprocess

          runtimes = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "runtimes", "-j"]))["runtimes"]
          ios = [r for r in runtimes if r.get("isAvailable") and (
              r.get("platform") == "iOS" or r["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-")
          )]
          if not ios:
              raise SystemExit("No available iOS Simulator runtime after platform setup")
          runtime = ios[-1]["identifier"]
          types = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devicetypes", "-j"]))["devicetypes"]
          phones = [t for t in types if t["name"].startswith("iPhone")]
          if not phones:
              raise SystemExit("No iPhone Simulator device types installed")
          device_type = next((t for t in phones if t["name"] == "iPhone 16"), phones[-1])
          udid = subprocess.check_output([
              "xcrun", "simctl", "create", "TrisMarketLens CI",
              device_type["identifier"], runtime
          ], text=True).strip()
          print(f"udid={udid}")
          PY
      - name: Run unit tests
        run: |
          xcodebuild test \
            -project TrisMarketLens.xcodeproj \
            -scheme TrisMarketLens \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            CODE_SIGNING_ALLOWED=NO
